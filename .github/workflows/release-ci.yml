name: Build release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build-release:
    name: Build release APKs
    needs: test
    # PRs only run the tests; builds happen on main, tags, and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME//\//-}"
          # ABI splits produce app-<abi>-release-unsigned.apk, plus app-universal-release-unsigned.apk.
          UNSIGNED=(app/build/outputs/apk/release/*-unsigned.apk)
          if [ ${#UNSIGNED[@]} -eq 0 ]; then
            echo "::error::No unsigned release APKs found."
            exit 1
          fi

          if [ -z "${KEYSTORE_BASE64}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
              exit 1
            fi
            echo "::warning::No signing secrets set; uploading the unsigned APKs."
            for apk in "${UNSIGNED[@]}"; do
              abi=$(basename "$apk" | sed -E 's/^app-(.+)-release-unsigned\.apk$/\1/')
              cp "$apk" "SeekFrame-${VERSION}-${abi}-unsigned.apk"
            done
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for apk in "${UNSIGNED[@]}"; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release-unsigned\.apk$/\1/')
            out="SeekFrame-${VERSION}-${abi}.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$out" \
              "$apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$out"
          done

          sha256sum SeekFrame-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: |
            SeekFrame-*.apk
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v5
        with:
          name: release-apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SeekFrame-*.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
